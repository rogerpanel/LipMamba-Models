# LipMamba-1.3B reference config.  Requires 4 × A100 80 GB.
seed: 42

model:
  variant: lipmamba_1300m
  vocab_size: 50257
  n_layers: 64
  d_model: 2048
  d_inner: 4096
  state_dim: 16
  conv_kernel: 4
  s_b: 1.0
  s_c: 1.0
  s_delta: 0.5
  s_out: 1.0
  delta_max: 0.5
  lambda_min: 0.05
  lambda_max: 1.0
  n_power_iters: 1
  l_ssm_cap: 12.0
  n_classes: 0
  s_head: 1.0
  epsilon_train: 0.18

dataset:
  name: slimpajama
  block_size: 2048
  batch_size: 4
  num_workers: 8
  token_path: data_cache/slimpajama_train.bin
  val_token_path: data_cache/slimpajama_val.bin

trainer:
  max_steps: 500000
  warmup_steps: 5000
  lr: 1.0e-4
  weight_decay: 0.1
  grad_clip: 1.0
  epsilon_train: 0.18
  log_every: 200
  eval_every: 10000
  save_every: 10000
  out_dir: runs/lipmamba_1300m
  use_margin_objective: true
  use_attack: null

pac_bayes:
  delta: 0.05
  sigma_post: 0.05
  sigma_prior: 0.10
  epsilon_train: 0.18
  beta: 1.0
  n_train: 500000
