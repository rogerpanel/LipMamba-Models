# LipMamba-130M reference config (Section 5 of the paper).
seed: 42

model:
  variant: lipmamba_130m
  vocab_size: 50257
  n_layers: 24
  d_model: 768
  d_inner: 1536
  state_dim: 16
  conv_kernel: 4
  s_b: 1.0
  s_c: 1.0
  s_delta: 0.5
  s_out: 1.0
  delta_max: 0.5
  lambda_min: 0.05
  lambda_max: 1.0
  n_power_iters: 1
  l_ssm_cap: 5.0
  n_classes: 0
  s_head: 1.0
  epsilon_train: 0.18

dataset:
  name: wikitext103
  block_size: 1024
  batch_size: 32
  num_workers: 4
  token_path: data_cache/wikitext103_train.bin
  val_token_path: data_cache/wikitext103_val.bin

trainer:
  max_steps: 100000
  warmup_steps: 1000
  lr: 2.0e-4
  weight_decay: 0.1
  grad_clip: 1.0
  epsilon_train: 0.18
  log_every: 100
  eval_every: 5000
  save_every: 5000
  out_dir: runs/lipmamba_130m
  use_margin_objective: true
  use_attack: null

pac_bayes:
  delta: 0.05
  sigma_post: 0.05
  sigma_prior: 0.10
  epsilon_train: 0.18
  beta: 1.0
  n_train: 100000
